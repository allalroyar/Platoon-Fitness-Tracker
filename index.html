<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעקב כושר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2;--card:#FFFFFF;--card2:#EBEBEB;--fill:#DEDEDE;
  --fg:#1C1C1C;--muted:#8E8E8E;--accent:#629050;--danger:#E0342A;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.04);
  --navbg:rgba(255,255,255,.82);--picker-hl:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212;--card:#1E1E1E;--card2:#2C2C2C;--fill:#3A3A3A;
    --fg:#F2F2F2;--muted:#8E8E8E;--accent:#79AA67;--danger:#FF453A;
    --shadow:0 1px 3px rgba(0,0,0,.5);--navbg:rgba(30,30,30,.78);--picker-hl:#484848;
  }
}
:root[data-theme="dark"]{
  --bg:#121212;--card:#1E1E1E;--card2:#2C2C2C;--fill:#3A3A3A;
  --fg:#F2F2F2;--muted:#8E8E8E;--accent:#79AA67;--danger:#FF453A;
  --shadow:0 1px 3px rgba(0,0,0,.5);--navbg:rgba(30,30,30,.78);--picker-hl:#484848;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:"Heebo","Arial Hebrew",Arial,sans-serif;
  font-size:17px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,.big{font-family:"Rubik","Heebo","Arial Hebrew",Arial,sans-serif;letter-spacing:-.01em}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 118px}
.wrap.no-nav{padding-bottom:20px}
.proto{
  background:var(--card2);color:var(--muted);border-radius:12px;
  padding:8px 12px;font-size:13px;margin-bottom:8px;
}
.permlink{display:block;margin:0 0 20px auto;color:var(--muted)}
h1{font-size:30px;font-weight:700;margin:0 0 4px;line-height:1.2;color:var(--fg)}
h2{font-size:19px;font-weight:700;margin:30px 0 10px;line-height:1.3;color:var(--fg)}
p{margin:0}
.sub{margin-bottom:8px;color:var(--muted)}
.muted{font-size:14px;color:var(--muted)}
button,input,textarea,select{font:inherit;color:var(--fg)}
button{
  background:var(--card2);border:0;border-radius:14px;
  padding:12px 16px;cursor:pointer;min-height:48px;
}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#fff;font-weight:600}
button.block{width:100%}
button.small{min-height:38px;padding:8px 14px;font-size:14px;border-radius:10px}
button.link{border:0;padding:8px 0;min-height:40px;text-decoration:none;color:var(--accent);font-weight:600;background:transparent}
button.iconbtn{
  border:0;background:var(--card2);padding:8px;
  width:38px;height:38px;min-width:38px;min-height:38px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg);
}
input,textarea,select{
  width:100%;background:var(--card2);border:0;border-radius:12px;
  padding:12px 14px;font-size:16px;
}
select{appearance:none;-webkit-appearance:none}
textarea{min-height:130px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin:18px 0 6px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack>*+*{margin-top:10px}
.card{
  display:block;width:100%;text-align:right;
  background:var(--card);border:0;border-radius:16px;padding:16px;box-shadow:var(--shadow);
}
.card .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card .name{font-weight:600}
.card .st{white-space:nowrap;color:var(--muted);font-size:14px}
.card.done{box-shadow:var(--shadow),0 0 0 2px var(--accent) inset}
.card.done .st{color:var(--accent);font-weight:600}
.klvl{font-size:21px;font-weight:800;font-family:"Rubik","Heebo",sans-serif;letter-spacing:-.01em}
.klvl-fail{color:var(--danger)}
.klvl-pass{color:var(--fg)}
.klvl-excellent{color:var(--accent)}
.tag{display:inline-block;font-size:12px;color:var(--muted);background:var(--card2);border-radius:999px;padding:3px 10px;margin-top:8px}
.bar{height:8px;border:0;border-radius:999px;background:var(--fill);margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.details{white-space:pre-wrap;background:var(--card2);border:0;border-radius:14px;padding:14px 16px;margin:16px 0}
.err{background:color-mix(in srgb, var(--danger) 14%, transparent);color:var(--danger);border:0;border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;margin:0;border:0;background:transparent;border-radius:9px;color:var(--fg);min-height:38px;font-weight:500}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.big{font-size:56px;font-weight:800;line-height:1.1;color:var(--fg)}
.picker{position:relative;margin-top:4px;background:var(--card2);border-radius:16px;padding:0 0}
.pwrap{display:flex;align-items:center;justify-content:center;height:180px;position:relative;z-index:1}
.pcol{width:76px;height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:68px 0}
.pcol::-webkit-scrollbar{display:none}
.pcol .pi{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:26px;font-weight:400;font-family:"Rubik","Heebo",sans-serif;font-variant-numeric:tabular-nums;color:var(--fg);opacity:.32}
.pcol .pi.sel{opacity:1;font-weight:700}
.pcolon{font-size:26px;font-weight:700;padding:0 8px;font-family:"Rubik","Heebo",sans-serif;color:var(--fg)}
.phit{position:absolute;left:12px;right:12px;top:68px;height:44px;background:var(--picker-hl);border-radius:10px;box-shadow:var(--shadow);pointer-events:none;z-index:0}
.punits{display:flex;justify-content:center;gap:0;margin-top:2px;padding-bottom:10px}
.punits span{width:76px;text-align:center;font-size:12px;color:var(--muted)}
.punits .pcolon-sp{padding:0 8px;width:auto}
.punits span.wide{width:112px}
.pcol.wide{width:112px}
.pcol .pi.label{font-size:15px;font-family:"Heebo","Arial Hebrew",Arial,sans-serif}
.line{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--card);border:0;border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.line:last-child{margin-bottom:0}
.grow{flex:1}
.permrow{flex-wrap:wrap;row-gap:8px}
.permbtns{display:flex;gap:8px;white-space:nowrap}
.permbtns button{white-space:nowrap}
nav{
  position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  background:var(--navbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.16);
  z-index:10;
}
nav .in{display:flex;max-width:480px;margin:0 auto;padding:6px;gap:4px}
nav button{flex:1;border:0;border-radius:14px;min-height:52px;font-size:13px;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap;padding:0 2px}
@media (max-width:340px){nav button{font-size:11px}}
nav button.on{background:var(--card2);color:var(--accent)}

/* ---------- Firebase (plain REST, no SDK) ---------- */
var FB_CONFIG={apiKey:"AIzaSyDwityXYqOgKda2Xhpti4e7PuQLO2p3rMo",projectId:"platoon-fitness-tracker"};
var FS_BASE='https://firestore.googleapis.com/v1/projects/'+FB_CONFIG.projectId+'/databases/(default)/documents/';
var AUTH_SIGNUP='https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB_CONFIG.apiKey;
var AUTH_REFRESH='https://securetoken.googleapis.com/v1/token?key='+FB_CONFIG.apiKey;
var LS_KEY='pft_auth_v1';
var auth={uid:null,idToken:null,refreshToken:null,expAt:0};

function saveAuth(){try{localStorage.setItem(LS_KEY,JSON.stringify(auth))}catch(e){}}
function loadAuth(){try{var s=localStorage.getItem(LS_KEY);if(s){var a=JSON.parse(s);if(a&&a.uid&&a.refreshToken){auth=a;return true}}}catch(e){}return false}
function signInAnon(){
  return fetch(AUTH_SIGNUP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})})
    .then(function(r){if(!r.ok)throw new Error('auth-signup-failed');return r.json()})
    .then(function(d){
      auth={uid:d.localId,idToken:d.idToken,refreshToken:d.refreshToken,expAt:Date.now()+(parseInt(d.expiresIn,10)||3600)*1000-60000};
      saveAuth();
    });
}
function refreshAuth(){
  var body='grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.refreshToken);
  return fetch(AUTH_REFRESH,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
    .then(function(r){if(!r.ok)throw new Error('auth-refresh-failed');return r.json()})
    .then(function(d){
      auth.uid=d.user_id;auth.idToken=d.id_token;auth.refreshToken=d.refresh_token;
      auth.expAt=Date.now()+(parseInt(d.expires_in,10)||3600)*1000-60000;
      saveAuth();
    });
}
function ensureAuth(){
  if(auth.uid && auth.idToken && Date.now()<auth.expAt) return Promise.resolve();
  if(auth.refreshToken) return refreshAuth().catch(function(){return signInAnon()});
  return signInAnon();
}

function fsEnc(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number') return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==='string') return {stringValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(fsEnc)}};
  if(typeof v==='object'){var f={};for(var k in v){if(v.hasOwnProperty(k))f[k]=fsEnc(v[k])}return {mapValue:{fields:f}}}
  return {stringValue:String(v)};
}
function fsDec(val){
  if(!val) return null;
  if('nullValue' in val) return null;
  if('booleanValue' in val) return val.booleanValue;
  if('integerValue' in val) return parseInt(val.integerValue,10);
  if('doubleValue' in val) return val.doubleValue;
  if('stringValue' in val) return val.stringValue;
  if('arrayValue' in val) return (val.arrayValue.values||[]).map(fsDec);
  if('mapValue' in val){var o={},f=val.mapValue.fields||{};for(var k in f){if(f.hasOwnProperty(k))o[k]=fsDec(f[k])}return o}
  return null;
}
function fsDecDoc(doc){
  var o={},f=doc.fields||{};
  for(var k in f){if(f.hasOwnProperty(k))o[k]=fsDec(f[k])}
  o.id=doc.name.split('/').pop();
  return o;
}
function fsFields(obj){
  var f={};for(var k in obj){if(obj.hasOwnProperty(k)&&k!=='id')f[k]=fsEnc(obj[k])}return f;
}
function markSync(ok){
  var el=document.getElementById('syncMsg');
  if(el) el.textContent=ok?'':'בעיית חיבור - שינויים אחרונים אולי לא נשמרו. בדוק את החיבור לאינטרנט.';
}
function fsList(col){
  return ensureAuth().then(function(){
    return fetch(FS_BASE+col+'?pageSize=1000',{headers:{'Authorization':'Bearer '+auth.idToken}});
  }).then(function(r){if(!r.ok)throw new Error('list-failed');return r.json()})
    .then(function(d){markSync(true);return (d.documents||[]).map(fsDecDoc)})
    .catch(function(e){markSync(false);throw e});
}
function fsSet(col,id,obj){
  return ensureAuth().then(function(){
    return fetch(FS_BASE+col+'/'+encodeURIComponent(id),{
      method:'PATCH',headers:{'Authorization':'Bearer '+auth.idToken,'Content-Type':'application/json'},
      body:JSON.stringify({fields:fsFields(obj)})
    });
  }).then(function(r){if(!r.ok)throw new Error('set-failed');markSync(true);return r})
    .catch(function(e){markSync(false);throw e});
}
function fsDel(col,id){
  return ensureAuth().then(function(){
    return fetch(FS_BASE+col+'/'+encodeURIComponent(id),{method:'DELETE',headers:{'Authorization':'Bearer '+auth.idToken}});
  }).then(function(r){if(!r.ok)throw new Error('del-failed');markSync(true);return r})
    .catch(function(e){markSync(false);throw e});
}

function fmtDate(ts){
  var d=new Date(ts);
  var days=['יום א’','יום ב’','יום ג’','יום ד’','יום ה’','יום ו’','שבת'];
  var hh=d.getHours(),mm=d.getMinutes();
  return days[d.getDay()]+', '+(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}

  });

  var sorted=soldiers.slice().sort(function(a,b){return doneCount(a.id)-doneCount(b.id)});
  out+='<h2>לפי חייל, מהנמוך לגבוה</h2><div>'+sorted.map(function(s){
    return '<div class="line"><span class="grow">'+esc(s.name)+'</span><span>כיתה '+s.squad+'</span><span style="min-width:44px;text-align:left">'+doneCount(s.id)+'/'+n+'</span></div>';
  }).join('')+'</div>';

function vCmdKshag(){
  var sortMode=view.kshagSort||'latest';
  var out='<button class="iconbtn" data-a="cmdkshagback" aria-label="חזרה לדוח">'+BACK_ICON+'</button>'+
    '<h1>בוחן כש״ג</h1><p class="sub">כלל המחלקה</p>';

  var bySoldier={};
  kshag.forEach(function(k){
    var cur=bySoldier[k.sid];
    if(!cur){bySoldier[k.sid]=k;return}
    if(sortMode==='best'){
      var rc=KLVL_RANK[k.levelClass]-KLVL_RANK[cur.levelClass];
      if(rc>0||(rc===0&&k.runSec<cur.runSec)) bySoldier[k.sid]=k;
    }else{
      if(k.dateTs>cur.dateTs) bySoldier[k.sid]=k;
    }
  });
  var reps=Object.keys(bySoldier).map(function(sid){return bySoldier[sid]});

  if(!reps.length){
    out+='<p class="muted" style="margin-top:20px">עדיין לא הוזנו תוצאות בוחן כש״ג.</p>';
    return out;
  }

  function avg(arr,key){return arr.length?Math.round(arr.reduce(function(a,x){return a+x[key]},0)/arr.length):0}
  var passRate=pct(reps.filter(function(r){return r.levelClass!=='fail'}).length,reps.length);

  out+='<div class="big" style="margin-top:16px">'+passRate+'%</div><p>עברו את הבוחן (ממוצע מחלקתי)</p>'+bar(passRate);

  out+='<h2>ממוצעים מחלקתיים</h2>'+
    '<div class="line"><span class="grow">ריצת 3 ק״מ</span><span>'+fmt(avg(reps,'runSec'))+'</span></div>'+
    '<div class="line"><span class="grow">ספרינטים 300 מ׳ X2</span><span>'+fmt(avg(reps,'sprintSec'))+'</span></div>'+
    '<div class="line"><span class="grow">מתח עם 7 ק״ג</span><span>'+avg(reps,'pull')+' חזרות</span></div>'+
    '<div class="line"><span class="grow">מקבילים</span><span>'+avg(reps,'dips')+' חזרות</span></div>';

  out+='<h2>לפי כיתה</h2>';
  SQUADS.forEach(function(q){
    var qr=reps.filter(function(r){return r.squad===q});
    if(!qr.length){
      out+='<div style="margin-bottom:16px"><div class="line" style="border:0;padding:0"><span style="font-weight:700">כיתה '+q+'</span><span class="muted">אין נתונים</span></div></div>';
      return;
    }
    var qPassRate=pct(qr.filter(function(r){return r.levelClass!=='fail'}).length,qr.length);
    out+='<div style="margin-bottom:16px"><div class="line" style="border:0;padding:0"><span style="font-weight:700">כיתה '+q+'</span><span>'+qr.length+' חיילים, '+qPassRate+'% עברו</span></div>'+bar(qPassRate)+
      '<p class="muted" style="margin-top:6px">ריצה '+fmt(avg(qr,'runSec'))+' · ספרינט '+fmt(avg(qr,'sprintSec'))+' · מתח '+avg(qr,'pull')+' · מקבילים '+avg(qr,'dips')+'</p></div>';
  });

  var seg='<div class="seg"><button data-a="kshagsort" data-v="latest" class="'+(sortMode==='latest'?'on':'')+'">הבוחן האחרון</button>'+
    '<button data-a="kshagsort" data-v="best" class="'+(sortMode==='best'?'on':'')+'">הבוחן הכי טוב</button></div>';
  out+='<h2>לפי חייל</h2><div style="margin-bottom:12px">'+seg+'</div>';

  var sortedReps=reps.slice().sort(function(a,b){
    if(sortMode==='best'){
      var rc=KLVL_RANK[b.levelClass]-KLVL_RANK[a.levelClass];
      return rc!==0?rc:a.runSec-b.runSec;
    }
    return b.dateTs-a.dateTs;
  });
  out+='<div class="stack">'+sortedReps.map(function(r){
    var sold=soldiers.filter(function(s){return s.id===r.sid})[0];
    var nm=sold?sold.name:r.sid;
    return '<div class="card"><div class="top"><span class="name">'+esc(nm)+'</span><span class="klvl klvl-'+r.levelClass+'" style="font-size:15px">'+esc(r.level)+'</span></div>'+
      '<p class="muted" style="margin-top:4px">כיתה '+esc(r.squad||'')+' · '+esc(r.date||'')+'</p>'+
      '<div class="details" style="margin-top:10px">ריצת 3 ק״מ: '+fmt(r.runSec)+'\nספרינטים 300 מ׳ X2: '+fmt(r.sprintSec)+'\nמתח עם 7 ק״ג: '+r.pull+'\nמקבילים: '+r.dips+'</div></div>';
  }).join('')+'</div>';

  return out;
}

/* ---------- wheel picker ---------- */
var PI_H=44;
function pad2(n){return (n<10?'0':'')+n}
function fmtByKind(kind,v){
  if(kind==='month') return HEBREW_MONTHS[v];
  if(kind==='pad2') return pad2(v);
  return String(v);
}
function wheelCol(id,min,max,def,kind,wide){
  return '<div class="pcol'+(wide?' wide':'')+'" id="'+id+'" data-min="'+min+'" data-max="'+max+'" data-default="'+def+'" data-kind="'+(kind||'plain')+'"></div>';
}
function fillWheel(el,min,max,sel,kind){
  var h='';
  for(var v=min;v<=max;v++){h+='<div class="pi'+(kind==='month'?' label':'')+(v===sel?' sel':'')+'" data-v="'+v+'">'+fmtByKind(kind,v)+'</div>'}
  el.innerHTML=h;
  el.scrollTop=(sel-min)*PI_H;
}
function markSel(el,idx){
  for(var i=0;i<el.children.length;i++) el.children[i].classList.toggle('sel',i===idx);
}
function wireWheel(el,onChange){
  var t=null;
  el.addEventListener('scroll',function(){
    if(t) clearTimeout(t);
    t=setTimeout(function(){
      var idx=Math.round(el.scrollTop/PI_H);
      idx=Math.max(0,Math.min(el.children.length-1,idx));
      var target=idx*PI_H;
      if(Math.abs(el.scrollTop-target)>1) el.scrollTo({top:target,behavior:'smooth'});
      markSel(el,idx);
      onChange(parseInt(el.children[idx].getAttribute('data-v'),10));
    },120);
  },{passive:true});
}
function initWheels(){
  var cols=document.querySelectorAll('.pcol');
  for(var i=0;i<cols.length;i++){
    (function(el){
      var id=el.id;
      var min=parseInt(el.getAttribute('data-min'),10);
      var max=parseInt(el.getAttribute('data-max'),10);
      var kind=el.getAttribute('data-kind')||'plain';
      var def=parseInt(el.getAttribute('data-default'),10);
      if(view.wheelVals[id]==null) view.wheelVals[id]=def;
      fillWheel(el,min,max,view.wheelVals[id],kind);
      wireWheel(el,function(v){view.wheelVals[id]=v});
    })(cols[i]);
  }
}

/* ---------- render ---------- */
var app=document.getElementById('app'),navEl=document.getElementById('nav'),navbarEl=document.getElementById('navbar'),wrapEl=document.getElementById('wrap');
function render(){
  if(view.role!=='soldier' && (!me || !hasPerm(me.id,view.role))) view.role='soldier';
  var h=view.permAdmin?vPermAdmin():(view.role==='soldier'?vSoldier():view.role==='coach'?vCoach():vCmd());
  app.innerHTML=h;
  var roles=[['soldier','חייל']];
  if(me && hasPerm(me.id,'coach')) roles.push(['coach','אחראי כושר']);
  if(me && hasPerm(me.id,'cmd')) roles.push(['cmd','מפקד']);
  if(roles.length<2){
    navbarEl.style.display='none';
    wrapEl.classList.add('no-nav');
  }else{
    navbarEl.style.display='';
    wrapEl.classList.remove('no-nav');
    navEl.innerHTML=roles.map(function(r){
      return '<button data-a="role" data-v="'+r[0]+'" class="'+(!view.permAdmin&&view.role===r[0]?'on':'')+'">'+r[1]+'</button>';
    }).join('');
  }
  initWheels();
}
function vPermAdmin(){
  var out='<button class="iconbtn" data-a="permback" aria-label="חזרה">'+BACK_ICON+'</button>'+
    '<h1>ניהול הרשאות</h1>'+
    '<p class="sub">סמן מי מהחיילים הוא מפקד ו/או אחראי כושר. רק להם תופיע גישה לטאבים המתאימים.</p>';
  if(!soldiers.length){
    out+='<p style="margin-top:24px">עדיין אין חיילים רשומים.</p>';
    return out;
  }
  out+='<div class="stack" style="margin-top:20px">'+soldiers.map(function(s){
    var isMe=s.id===auth.uid;
    return '<div class="line permrow"><span class="grow">'+esc(s.name)+(isMe?' (אני)':'')+' <span class="muted" style="font-size:12px">כיתה '+esc(s.squad)+'</span></span>'+
      '<span class="permbtns">'+
      '<button class="small'+(hasPerm(s.id,'cmd')?' primary':'')+'" data-a="permtoggle" data-v="cmd" data-id="'+s.id+'">מפקד</button>'+
      '<button class="small'+(hasPerm(s.id,'coach')?' primary':'')+'" data-a="permtoggle" data-v="coach" data-id="'+s.id+'">אחראי כושר</button>'+
      '</span></div>';
  }).join('')+'</div>';
  return out;
}
function top(){window.scrollTo(0,0)}
function val(id){var el=document.getElementById(id);return el?el.value:''}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(!el) return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  view.err='';
  if(a==='role'){
    if(v!=='soldier' && (!me || !hasPerm(me.id,v))){render();return}
    view.role=v;view.tid=null;view.edit=null;view.delId=null;view.cmdKshag=false;view.permAdmin=false;top();
  }
  else if(a==='permopen'){view.permAdmin=true;top()}
  else if(a==='permback'){view.permAdmin=false;top()}
  else if(a==='permtoggle'){
    var cur=hasPerm(id,v);
    setPerm(id,v,!cur);
    fsSet('permissions',id,permissions[id]);
    if(me && id===me.id && cur && view.role===v) view.role='soldier';
  }
  else if(a==='sq'){view.nm=val('nm');view.sq=v}
  else if(a==='start'){
    var nm=val('nm').trim();view.nm=nm;
    if(!nm){view.err='כתוב את השם המלא שלך.'}
    else if(!view.sq){view.err='בחר כיתה.'}
    else{me={id:auth.uid,name:nm,squad:view.sq};soldiers.push(me);fsSet('soldiers',auth.uid,{name:nm,squad:view.sq});top()}
  }
  else if(a==='open'){view.tid=id;top()}
  else if(a==='back'){view.tid=null;top()}
  else if(a==='done'){
    var t=byId(id);
    if(t.type==='running'){
      var km=val('km').trim().replace(',','.');
      var kmn=parseFloat(km);
      var tsec=(view.wheelVals.pmin||0)*60+(view.wheelVals.psec||0);
      if(!(kmn>0)){view.err='כתוב את המרחק שרצת בק״מ.'}
      else if(tsec<=0){view.err='גלול ובחר כמה זמן לקח לך.'}
      else if(tsec/kmn<150||tsec/kmn>900){view.err='המרחק והזמן לא מסתדרים. בדוק אותם ונסה שוב.'}
      else{
        var rr={km:km,time:fmt(tsec),pace:fmt(tsec/kmn),at:Date.now()};
        reports[auth.uid+'|'+id]=rr;
        fsSet('reports',auth.uid+'_'+id,{sid:auth.uid,tid:id,km:rr.km,time:rr.time,pace:rr.pace,at:rr.at});
        view.tid=null;delete view.wheelVals.pmin;delete view.wheelVals.psec;
      }
    }else{
      var rr2={at:Date.now()};
      reports[auth.uid+'|'+id]=rr2;
      fsSet('reports',auth.uid+'_'+id,{sid:auth.uid,tid:id,at:rr2.at});
      view.tid=null;
    }
  }
  else if(a==='undo'){delete reports[auth.uid+'|'+id];fsDel('reports',auth.uid+'_'+id)}
  else if(a==='openpersonal'){view.personal=true;view.pTab='history';top()}
  else if(a==='pback'){view.personal=false;top()}
  else if(a==='ptab'){view.pTab=v}
  else if(a==='addgoal'){
    var gt=val('gtxt').trim();
    if(!gt){view.err='כתוב את היעד שלך.'}
    else{var ng=addGoal(gt);fsSet('goals',ng.id,{sid:ng.sid,text:ng.text,done:ng.done})}
  }
  else if(a==='gtoggle'){var tg=toggleGoal(id);if(tg)fsSet('goals',tg.id,{sid:tg.sid,text:tg.text,done:tg.done})}
  else if(a==='gdelconfirm'){view.gDelId=id}
  else if(a==='gdelno'){view.gDelId=null}
  else if(a==='gdel'){delGoal(id);view.gDelId=null;fsDel('goals',id)}
  else if(a==='addkshag'){
    var wv=view.wheelVals;
    var kDay=wv.kdate_day,kMonth=wv.kdate_month,kYear=wv.kdate_year;
    var runSec=(wv.krun_min||0)*60+(wv.krun_sec||0);
    var sprintSec=(wv.ksprint_min||0)*60+(wv.ksprint_sec||0);
    var pull=wv.kpull_n,dips=wv.kdips_n;
    var g=gradeKshag(pull,dips,sprintSec,runSec);
    var kid='k_'+auth.uid+'_'+Date.now();
    var krec={id:kid,sid:auth.uid,squad:me?me.squad:(view.sq||''),
      date:kshagDateStr(kDay,kMonth,kYear),dateTs:new Date(kYear,kMonth,kDay).getTime(),
      runSec:runSec,sprintSec:sprintSec,pull:pull,dips:dips,
      level:g.level,levelClass:g.levelClass};
    kshag.push(krec);
    fsSet('kshag',kid,{sid:krec.sid,squad:krec.squad,date:krec.date,dateTs:krec.dateTs,runSec:krec.runSec,sprintSec:krec.sprintSec,pull:krec.pull,dips:krec.dips,level:krec.level,levelClass:krec.levelClass});
    ['kdate_day','kdate_month','kdate_year','krun_sec','krun_min','ksprint_sec','ksprint_min','kpull_n','kdips_n'].forEach(function(k){delete wv[k]});
    view.kshagOpen=false;
  }
  else if(a==='kshagopen'){view.kshagOpen=true}
  else if(a==='kdelconfirm'){view.kDelId=id}
  else if(a==='kdelno'){view.kDelId=null}
  else if(a==='kdel'){delKshag(id);view.kDelId=null;fsDel('kshag',id)}
  else if(a==='kshagdetail'){view.cmdKshag=true;top()}
  else if(a==='cmdkshagback'){view.cmdKshag=false;top()}
  else if(a==='kshagsort'){view.kshagSort=v}
  else if(a==='ctype'){view.coachType=v;view.edit=null;view.delId=null;view.draft=null}
  else if(a==='new'){view.edit='new';view.draft=null}
  else if(a==='edit'){view.edit=id;view.draft=null}
  else if(a==='cancel'){view.edit=null;view.draft=null}
  else if(a==='del'){view.delId=id}
  else if(a==='delno'){view.delId=null}
  else if(a==='delok'){
    trainings=trainings.filter(function(t){return t.id!==id});
    view.delId=null;
    fsDel('trainings',id);
  }
  else if(a==='save'){
    view.draft={ttl:val('ttl'),det:val('det'),tkm:val('tkm'),tpc:val('tpc')};
    var ttl=val('ttl').trim(),det=val('det').trim();
    if(!ttl){view.err='כתוב שם לאימון.'}
    else{
      var tp=view.edit==='new'?view.coachType:byId(view.edit).type;
      var obj={title:ttl,details:det};
      if(tp==='running'){
        var tk=val('tkm').trim(),tpc=val('tpc').trim();
        if(tpc&&isNaN(parsePace(tpc))){view.err='כתוב את היעד בפורמט דקות:שניות, למשל 5:45.';render();return}
        obj.targetKm=tk;obj.targetPace=tpc;
      }
      var savedId;
      if(view.edit==='new'){obj.id='t'+(nextId++);obj.type=tp;trainings.push(obj);savedId=obj.id}
      else{var ex=byId(view.edit);for(var k in obj)ex[k]=obj[k];savedId=view.edit}
      var full=byId(savedId);
      fsSet('trainings',savedId,{type:full.type,title:full.title,details:full.details,targetKm:full.targetKm||null,targetPace:full.targetPace||null});
      view.edit=null;view.draft=null;
    }
  }
  render();
});

function finishInit(so,rp,gl,ks,pm){
  soldiers=so.map(function(d){return {id:d.id,name:d.name,squad:d.squad}});
  reports={};
  rp.forEach(function(d){reports[d.sid+'|'+d.tid]={km:d.km,time:d.time,pace:d.pace,at:d.at}});
  goals=gl.map(function(d){return {id:d.id,sid:d.sid,text:d.text,done:!!d.done}});
  kshag=ks.map(function(d){return {id:d.id,sid:d.sid,squad:d.squad,date:d.date,dateTs:d.dateTs,runSec:d.runSec,sprintSec:d.sprintSec,pull:d.pull,dips:d.dips,level:d.level,levelClass:d.levelClass}});
  permissions={};
  pm.forEach(function(d){permissions[d.id]={cmd:!!d.cmd,coach:!!d.coach}});
  me=soldiers.filter(function(s){return s.id===auth.uid})[0]||null;
  markSync(true);
  render();
}
function init(){
  loadAuth();
  ensureAuth().then(function(){
    return fsList('trainings');
  }).then(function(tr){
    if(tr.length){
      trainings=tr.map(function(d){return {id:d.id,type:d.type,title:d.title,details:d.details,targetKm:d.targetKm,targetPace:d.targetPace}});
      var maxN=0;
      trainings.forEach(function(t){var m=/^t(\d+)$/.exec(t.id);if(m) maxN=Math.max(maxN,parseInt(m[1],10))});
      nextId=maxN+1;
      return;
    }
    return Promise.all(trainings.map(function(t){
      return fsSet('trainings',t.id,{type:t.type,title:t.title,details:t.details,targetKm:t.targetKm||null,targetPace:t.targetPace||null});
    }));
  }).then(function(){
    return Promise.all([fsList('soldiers'),fsList('reports'),fsList('goals'),fsList('kshag'),fsList('permissions')]);
  }).then(function(res){
    finishInit(res[0],res[1],res[2],res[3],res[4]);
  }).catch(function(e){
    markSync(false);
    var app=document.getElementById('app');
    if(app) app.innerHTML='<p class="err">לא הצלחנו להתחבר לשרת. בדוק את החיבור לאינטרנט ורענן את הדף.</p>';
  });
}
init();
})();
</script>
